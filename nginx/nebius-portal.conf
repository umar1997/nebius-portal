# /etc/nginx/sites-available/nebius-portal
#
# Handles three traffic classes:
#   1. Static React SPA files from /var/www/nebius-portal
#   2. /api/*  → Node.js backend at localhost:3001
#   3. /app/*  → Node.js SOCKS5 proxy (supports WebSocket upgrades for Gradio)

# Map the Upgrade header to the correct Connection value.
# Without this, sending Connection: upgrade on plain HTTP requests
# breaks keep-alive and causes Chrome to stall.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name nebius-portal-vm.uaenorth.cloudapp.azure.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nebius-portal-vm.uaenorth.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/nebius-portal-vm.uaenorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebius-portal-vm.uaenorth.cloudapp.azure.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SPA root
    root /var/www/nebius-portal;
    index index.html;

    # Serve static files; fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy ---
    # All /api/* requests go straight to the Node.js backend.
    location /api/ {
        proxy_pass         http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- App proxy ---
    # /app/* is forwarded to Node.js which routes through the SOCKS5 tunnel.
    # WebSocket upgrade is required for Gradio (uses /queue/join WS endpoint).
    # proxy_read_timeout is high because ML app inference can be slow.
    #
    # sub_filter rewrites Gradio's absolute asset paths (src="/assets/...")
    # to relative paths (src="assets/...") so the browser resolves them as
    # /app/{id}/assets/... and they route back through this proxy correctly.
    # Accept-Encoding "" prevents gzip from blocking sub_filter substitution.
    location /app/ {
        proxy_pass             http://localhost:3001/app/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       Accept-Encoding   "";
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;

        sub_filter_once        off;
        sub_filter_types       text/html;
        sub_filter             'src="/assets/'   'src="assets/';
        sub_filter             'href="/assets/'  'href="assets/';
        sub_filter             'from "/assets/'  'from "assets/';
    }
}
